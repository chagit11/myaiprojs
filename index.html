<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Голос в текст — мульти-язычный пример</title>

  <!-- Шрифты: Playfair (красивый для латиницы/кириллицы) и Cairo для арабского -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#06b6d4;
      --text:#e6f0ff;
      --muted:#9aa9bf;
    }
    html,body{height:100%;margin:0;font-family:"Playfair Display", Georgia, serif;background:linear-gradient(180deg,#071021 0%, #0b1a2b 100%);color:var(--text);}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:30px;box-sizing:border-box;}
    .card{width:100%;max-width:920px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(2,6,23,0.6);}
    .controls{display:flex;gap:18px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
    .lang{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;font-size:16px}
    .mic-btn{
      width:84px;height:84px;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;cursor:pointer;box-shadow:0 8px 30px rgba(96,165,250,0.12), inset 0 -6px 18px rgba(0,0,0,0.2);transition:transform .12s;
      position:relative;
    }
    .mic-btn:active{transform:scale(.96)}
    .mic-icon{width:42px;height:42px;fill:white}
    .mic-btn.listening{animation:pulse 1.2s infinite;}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(6,182,212,0.35)}
      70%{box-shadow:0 0 0 24px rgba(6,182,212,0)}
      100%{box-shadow:0 0 0 0 rgba(6,182,212,0)}
    }

    .transcript{
      min-height:220px;padding:22px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));border:1px solid rgba(255,255,255,0.03);font-size:20px;line-height:1.6;white-space:pre-wrap;overflow:auto;
      color:var(--text);
    }
    .muted{color:var(--muted);font-size:14px;margin-top:10px}
    .interim{opacity:.7;color: #d0f7ff }
    .lang-note{font-size:13px;color:var(--muted)}
    /* Special styles for Arabic (rtl) */
    .rtl {direction:rtl;font-family:"Cairo", "Noto Naskh Arabic", serif;}
    /* make final text visually nicer */
    .final-text{font-size:26px;font-weight:600;letter-spacing:0.2px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="app">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <h2 style="margin:0 0 6px 0">Диктовка — голос в текст</h2>
          <div class="lang-note">Нажмите кнопку микрофона и говорите — текст появится на экране. Выберите язык.</div>
        </div>

        <div class="controls">
          <select id="lang" class="lang" aria-label="Выбор языка">
            <option value="ru-RU">Русский — ru-RU</option>
            <option value="en-US">English — en-US</option>
            <option value="ar-SA">العربية — ar-SA</option>
            <!-- можно добавить другие локали -->
          </select>

          <button id="mic" class="mic-btn" aria-pressed="false" aria-label="Запись голоса">
            <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path>
              <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V20a1 1 0 0 0 2 0v-4.1A5 5 0 0 0 19 11z"></path>
            </svg>
          </button>
        </div>
      </div>

      <div id="transcript" class="transcript" tabindex="0" aria-live="polite">
        <div id="final" class="final-text"></div>
        <div id="interim" class="interim"></div>
      </div>

      <div class="muted" id="status"></div>
    </div>
  </div>

  <script>
    // Простая проверка поддержки
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('mic');
    const langSelect = document.getElementById('lang');
    const finalEl = document.getElementById('final');
    const interimEl = document.getElementById('interim');
    const statusEl = document.getElementById('status');
    const transcriptBox = document.getElementById('transcript');
    let recognition;
    let listening = false;

    function setStatus(text, muted=false){
      statusEl.textContent = text;
      statusEl.style.color = muted ? '' : '';
    }

    if(!SpeechRecognition){
      setStatus('Ваш браузер не поддерживает Web Speech API. Рекомендуется Chrome (десктоп/Android).', true);
      micBtn.disabled = true;
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;      // пытаться слушать долго (поведение зависит от браузера)
      recognition.interimResults = true;  // показывать промежуточный текст
      recognition.maxAlternatives = 1;

      // Установим язык из селектора
      recognition.lang = langSelect.value;

      // Результаты
      recognition.onresult = (event) => {
        let interim = '';
        let finalText = finalEl.textContent || '';
        for (let i = event.resultIndex; i < event.results.length; i++){
          const res = event.results[i];
          if(res.isFinal){
            finalText += (finalText ? ' ' : '') + res[0].transcript.trim();
          } else {
            interim += res[0].transcript;
          }
        }
        finalEl.textContent = finalText;
        interimEl.textContent = interim;
      };

      recognition.onstart = () => {
        listening = true;
        micBtn.classList.add('listening');
        micBtn.setAttribute('aria-pressed', 'true');
        setStatus('Слушаю... Говорите.', true);
      };

      recognition.onend = () => {
        // Если пользователь ещё хочет слушать — попытаемся автоматически перезапустить
        micBtn.classList.remove('listening');
        micBtn.setAttribute('aria-pressed', 'false');
        listening = false;
        setStatus('Остановлено. Нажмите микрофон для начала.', true);
        // Автоматический рестарт (плавнее для длительной записи); удалите, если не нужно
        if(micBtn.dataset.autorestart === 'true'){
          try { recognition.start(); } catch(e){ /* ignore */ }
        }
      };

      recognition.onerror = (e) => {
        console.error('Speech recognition error', e);
        setStatus('Ошибка распознавания: ' + (e.error || e.message), false);
      };
    }

    // Управление кнопкой
    micBtn.addEventListener('click', () => {
      if(!SpeechRecognition) return;
      if(!listening){
        // Настроим язык перед стартом
        recognition.lang = langSelect.value;
        // Проставим направление текста и шрифт для арабского
        const isArabic = langSelect.value.startsWith('ar');
        if(isArabic){
          document.getElementById('app').querySelector('#transcript').classList.add('rtl');
        } else {
          document.getElementById('app').querySelector('#transcript').classList.remove('rtl');
        }
        try {
          recognition.start();
          micBtn.dataset.autorestart = 'true'; // попытаться поддерживать постоянно
        } catch(e){
          console.error(e);
        }
      } else {
        try {
          recognition.stop();
          micBtn.dataset.autorestart = 'false';
        } catch(e){}
      }
    });

    // При смене языка просто меняем направление/шрифт заранее
    langSelect.addEventListener('change', () => {
      const isArabic = langSelect.value.startsWith('ar');
      if(isArabic){
        transcriptBox.classList.add('rtl');
        // поменяем семейство шрифта на арабское при необходимости
        transcriptBox.style.fontFamily = '"Cairo", "Noto Naskh Arabic", serif';
      } else {
        transcriptBox.classList.remove('rtl');
        transcriptBox.style.fontFamily = '"Playfair Display", Georgia, serif';
      }
      // Если уже слушаем — перезапустим распознавание с новым lang
      if(listening && recognition){
        try {
          recognition.stop();
        } catch(e){}
        setTimeout(()=>{ recognition.lang = langSelect.value; try{ recognition.start(); }catch(e){} }, 150);
      }
    });

    // Инициализация UI в зависимости от поддержки
    if(SpeechRecognition){
      setStatus('Готов. Выберите язык и нажмите микрофон, чтобы начать.', true);
      // Установим начальный шрифт/дирекцию
      langSelect.dispatchEvent(new Event('change'));
    }
  </script>
</body>
</html>
