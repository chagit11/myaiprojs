<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Трекер Привычек</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .tracker-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 20px;
            background: var(--accent-color);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-box {
            aspect-ratio: 1;
            background: #334155;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .day-box span {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .day-box.checked {
            background: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
            transform: scale(1.05);
        }

        .progress-bar {
            background: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            background: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .stats {
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="tracker-card">
        <h1 id="habit-title">🔥 Моя привычка</h1>
        
        <div class="input-group">
            <input type="text" id="habit-input" placeholder="Какую привычку внедряем?">
            <button onclick="updateHabitName()">ОК</button>
        </div>

        <div class="days-grid" id="days-container"></div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="stats" id="stats-text">Выполнено: 0 из 21 дня (0%)</div>
    </div>

    <script>
        const TOTAL_DAYS = 21; // Классический цикл формирования привычки
        let checkedDays = JSON.parse(localStorage.getItem('habit_days')) || [];
        let habitName = localStorage.getItem('habit_name') || '🔥 Моя привычка';

        document.getElementById('habit-title').innerText = habitName;

        function renderGrid() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const box = document.createElement('div');
                box.className = `day-box ${checkedDays.includes(i) ? 'checked' : ''}`;
                box.innerHTML = `<span>${checkedDays.includes(i) ? '✓' : i}</span>`;
                
                box.onclick = () => toggleDay(i);
                container.appendChild(box);
            }
            updateProgress();
        }

        function toggleDay(dayNumber) {
            if (checkedDays.includes(dayNumber)) {
                checkedDays = checkedDays.filter(d => d !== dayNumber);
            } else {
                checkedDays.push(dayNumber);
            }
            localStorage.setItem('habit_days', JSON.stringify(checkedDays));
            renderGrid();
        }

        function updateProgress() {
            const percent = Math.round((checkedDays.length / TOTAL_DAYS) * 100);
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('stats-text').innerText = `Выполнено: ${checkedDays.length} из ${TOTAL_DAYS} дня (${percent}%)`;
        }

        function updateHabitName() {
            const input = document.getElementById('habit-input');
            if (input.value.trim() !== '') {
                habitName = input.value;
                document.getElementById('habit-title').innerText = habitName;
                localStorage.setItem('habit_name', habitName);
                input.value = '';
            }
        }

        renderGrid();
    </script>
</body>
</html>
